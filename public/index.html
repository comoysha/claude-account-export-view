<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cowork Session Viewer</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app">
    <aside class="col col-projects">
      <div class="col-header">
        <div class="title">Projects</div>
        <button id="refresh-btn" title="重新扫描">⟳</button>
      </div>
      <div class="search-box">
        <input id="search-input" type="search" placeholder="🔎 全文搜索…" autocomplete="off" />
      </div>
      <ul id="project-list" class="list"></ul>
    </aside>

    <aside class="col col-sessions">
      <div class="col-header">
        <div class="title" id="sessions-title">Sessions</div>
      </div>
      <ul id="session-list" class="list"></ul>
    </aside>

    <main class="col col-detail">
      <header id="detail-header" class="detail-header">
        <h1 id="detail-title">选择一个 session 开始浏览 →</h1>
        <div id="detail-meta" class="meta"></div>
      </header>
      <div id="detail-body" class="detail-body"></div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
